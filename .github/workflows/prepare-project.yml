name: Prepare MovePal Project

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and report without changing GitHub resources
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    name: Validate and prepare metadata
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MOVEPAL_PROJECT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Explain required organization Project credential
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MOVEPAL_PROJECT_TOKEN is not configured."
            echo "Use the local owner bootstrap for initial setup, or configure the documented GitHub App/token before this workflow."
            exit 1
          fi

      - name: Validate teams and backlog
        run: |
          python scripts/validate_teams.py --team-a config/team_a.csv --team-b config/team_b.csv
          python scripts/validate_backlog.py --backlog backlog/product_backlog.json

      - name: Prepare labels, milestones, Project fields, and repository link
        shell: bash
        run: |
          args=(
            --organization SE4CVndNN
            --repository movepal
            --project-title "MovePal — Product and Sprint Board"
            --metadata config/project_metadata.json
          )
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            args+=(--apply)
          fi
          python scripts/prepare_repository.py "${args[@]}"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MovePal preparation"
            echo "- Dry run: ${{ inputs.dry_run }}"
            echo "- Team validation: executed"
            echo "- Backlog validation: executed"
            echo "- Metadata preparation: see job log"
            echo "- Project views remain manual: docs/project_board_views.md"
          } >> "$GITHUB_STEP_SUMMARY"
