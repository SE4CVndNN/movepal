<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}MovePal{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}?v=117-preview-3"
    />
  </head>
  <body data-app-state="idle">
    <header class="site-header">
      <div class="header-row">
        <div class="header-start">
          <h1>MovePal</h1>
        </div>
        <div
          id="score-region"
          class="score-badge"
          role="status"
          aria-live="polite"
          aria-label="Stars earned this session"
        >
          <span aria-hidden="true">⭐</span>
          <span id="score-count">0</span>
        </div>
      </div>
      <p>Play, move, and collect stars.</p>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      MovePal is a playful prototype, not a medical or diagnostic tool.
    </footer>
    <script
      src="{{ url_for('static', filename='js/app.js') }}?v=117-preview-3"
      defer
    ></script>
  </body>
</html>
